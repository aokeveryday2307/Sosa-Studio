<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AOK // STUDIO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d0d0f;
            color: #f0f0f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            align-items: center;
        }
        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #141418;
            border-bottom: 1px solid #22222c;
        }
        h1 {
            font-size: 16px;
            letter-spacing: 2px;
            color: #b084ff;
            font-weight: 800;
        }
        .status-badge {
            font-size: 11px;
            background: #1e1e28;
            color: #a0a0b0;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #2d2d3c;
        }
        .canvas-container {
            width: 100%;
            max-width: 500px;
            flex-grow: 1;
            background: #08080a;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid #22222c;
        }
        canvas {
            background: #0b0b0e;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .controls-panel {
            width: 100%;
            max-width: 500px;
            padding: 16px;
            background: #141418;
            display: flex;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(3, 44px);
            gap: 4px;
        }
        .dpad-btn {
            background: #1e1e28;
            border: 1px solid #2d2d3c;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .dpad-btn:active {
            background: #b084ff;
            color: #0d0d0f;
        }
        .d-up { grid-column: 2; grid-row: 1; }
        .d-left { grid-column: 1; grid-row: 2; }
        .d-center { grid-column: 2; grid-row: 2; background: #141418; border: none; pointer-events: none; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down { grid-column: 2; grid-row: 3; }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        .action-btn {
            background: #b084ff;
            color: #0d0d0f;
            border: none;
            padding: 14px;
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(176, 132, 255, 0.2);
        }
        .action-btn:active {
            transform: scale(0.98);
            background: #9d6aff;
        }
        .secondary-btn {
            background: #1e1e28;
            color: #f0f0f5;
            border: 1px solid #2d2d3c;
            box-shadow: none;
        }
        .secondary-btn:active {
            background: #282836;
        }
    </style>
</head>
<body>
    <header>
        <h1>AOK // STUDIO</h1>
        <div class="status-badge" id="mode-indicator">Studio Free Roam</div>
    </header>
    
    <div class="canvas-container">
        <canvas id="gameCanvas" width="384" height="224"></canvas>
    </div>

    <div class="controls-panel">
        <div class="dpad">
            <button class="dpad-btn d-up" id="btn-up">▲</button>
            <button class="dpad-btn d-left" id="btn-left">◀</button>
            <div class="dpad-btn d-center"></div>
            <button class="dpad-btn d-right" id="btn-right">▶</button>
            <button class="dpad-btn d-down" id="btn-down">▼</button>
        </div>
        <div class="action-buttons">
            <button class="action-btn" id="btn-interact">Interact</button>
            <button class="action-btn secondary-btn" id="btn-beat">Toggle Beat</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = {
            x: 180,
            y: 100,
            size: 16,
            speed: 2,
            color: '#b084ff',
            dir: 'down'
        };

        let keys = { up: false, down: false, left: false, right: false };
        let isBeatPlaying = false;
        let audioCtx = null;
        let beatInterval = null;

        // Controls binding
        function setupButton(id, keyName) {
            const btn = document.getElementById(id);
            ['mousedown', 'touchstart'].forEach(evt => {
                btn.addEventListener(evt, (e) => { e.preventDefault(); keys[keyName] = true; });
            });
            ['mouseup', 'touchend', 'touchcancel'].forEach(evt => {
                btn.addEventListener(evt, (e) => { e.preventDefault(); keys[keyName] = false; });
            });
        }

        setupButton('btn-up', 'up');
        setupButton('btn-down', 'down');
        setupButton('btn-left', 'left');
        setupButton('btn-right', 'right');

        document.getElementById('btn-interact').addEventListener('click', () => {
            const indicator = document.getElementById('mode-indicator');
            indicator.textContent = "Interacted with Studio Gear!";
            setTimeout(() => { indicator.textContent = "Studio Free Roam"; }, 2000);
        });

        document.getElementById('btn-beat').addEventListener('click', () => {
            isBeatPlaying = !isBeatPlaying;
            const beatBtn = document.getElementById('btn-beat');
            const indicator = document.getElementById('mode-indicator');
            
            if (isBeatPlaying) {
                beatBtn.textContent = "Stop Beat";
                indicator.textContent = "Beat Playing ♫";
                startAudioLoop();
            } else {
                beatBtn.textContent = "Toggle Beat";
                indicator.textContent = "Studio Free Roam";
                stopAudioLoop();
            }
        });

        function startAudioLoop() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            let step = 0;
            beatInterval = setInterval(() => {
                if (!isBeatPlaying) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = (step % 4 === 0) ? 'square' : 'sine';
                osc.frequency.setValueAtTime((step % 4 === 0) ? 110 : 220, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
                step = (step + 1) % 8;
            }, 250);
        }

        function stopAudioLoop() {
            if (beatInterval) clearInterval(beatInterval);
        }

        function update() {
            if (keys.up && player.y > 10) player.y -= player.speed;
            if (keys.down && player.y < canvas.height - 26) player.y += player.speed;
            if (keys.left && player.x > 10) player.x -= player.speed;
            if (keys.right && player.x < canvas.width - 26) player.x += player.speed;
        }

        function drawGrid() {
            ctx.fillStyle = '#0b0b0e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#14141c';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 16) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 16) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function drawStudioProps() {
            // Mixing console desk
            ctx.fillStyle = '#1e1e28';
            ctx.fillRect(80, 50, 80, 40);
            ctx.fillStyle = '#b084ff';
            ctx.fillRect(90, 60, 16, 10);
            ctx.fillRect(115, 60, 10, 10);

            // Studio Monitors / Speakers
            ctx.fillStyle = '#181820';
            ctx.fillRect(260, 50, 32, 40);
            ctx.fillStyle = '#3a3a48';
            ctx.beginPath(); ctx.arc(276, 70, 8, 0, Math.PI * 2); ctx.fill();
        }

        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);
            // Simple head / hair detail
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 3, player.y + 2, 10, 4);
        }

        function loop() {
            update();
            drawGrid();
            drawStudioProps();
            drawPlayer();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
