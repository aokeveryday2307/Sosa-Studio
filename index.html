<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sosa's Studio // 2D Pixel Experience</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --accent-color: #7289da;
            --text-color: #e0e0e0;
            --hud-bg: rgba(15, 15, 20, 0.85);
            --border-color: #2a2a35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            border: 2px solid var(--border-color);
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* CRT Overlay Filter */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Top HUD Header */
        #hud-header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 40px;
            background: var(--hud-bg);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 20;
            border-radius: 4px;
        }

        .hud-title {
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
            font-size: 14px;
        }

        .hud-location {
            font-size: 12px;
            color: #888899;
        }

        /* On-Screen Mobile & Action Controls */
        #controls-overlay {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 20;
            pointer-events: none;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 2px;
            pointer-events: auto;
        }

        .dpad-btn {
            background: rgba(30, 30, 40, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .dpad-btn:active {
            background: rgba(100, 100, 150, 0.8);
        }

        .action-btn-container {
            pointer-events: auto;
        }

        .interact-btn {
            width: 90px;
            height: 45px;
            background: rgba(114, 137, 218, 0.8);
            border: 1px solid #ffffff;
            color: #fff;
            font-weight: bold;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .interact-btn:active {
            transform: translateY(2px);
            background: rgba(114, 137, 218, 1);
        }

        /* Generic Modal UI Frame */
        .modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 600px;
            background: rgba(15, 15, 22, 0.95);
            border: 2px solid var(--border-color);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            padding: 20px;
            z-index: 30;
            color: #fff;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-body {
            max-height: 380px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="crt-overlay"></div>

        <!-- HUD Header (No PIN text displayed) -->
        <div id="hud-header">
            <div class="hud-title">Sosa's Studio</div>
            <div class="hud-location" id="room-indicator">Zone: Street Entrance</div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- On-Screen Controls -->
        <div id="controls-overlay">
            <div class="dpad">
                <div></div>
                <div class="dpad-btn" id="btn-up">▲</div>
                <div></div>
                <div class="dpad-btn" id="btn-left">◄</div>
                <div></div>
                <div class="dpad-btn" id="btn-right">►</div>
                <div></div>
                <div class="dpad-btn" id="btn-down">▼</div>
                <div></div>
            </div>
            <div class="action-btn-container">
                <button class="interact-btn" id="btn-interact">[E] INTERACT</button>
            </div>
        </div>

        <!-- Universal Interactive Modal -->
        <div class="modal" id="game-modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Interactive Display</div>
                <button class="close-btn" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content injected dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Core Web Audio Controller Engine
        const AudioEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playTone(freq = 440, type = 'sine', duration = 0.2) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
        };

        // Canvas & Game State Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const state = {
            currentRoom: 'outside', // Options: 'outside', 'control_room', 'studio_room'
            keys: { up: false, down: false, left: false, right: false },
            player: {
                x: 400,
                y: 420,
                width: 24,
                height: 32,
                speed: 3,
                direction: 'down'
            },
            nearObject: null
        };

        // Room & Interactive Object Definitions
        const rooms = {
            outside: {
                name: "Outside Area",
                doors: [
                    { id: "door_studio_entry", x: 370, y: 220, width: 60, height: 40, targetRoom: "control_room", targetX: 400, targetY: 500, label: "Enter Studio" }
                ],
                objects: [
                    { id: "event_flyer", x: 180, y: 220, width: 40, height: 50, title: "Official Event Flyer", label: "Inspect Event Flyer" },
                    { id: "mdm_graffiti", x: 580, y: 250, width: 50, height: 30, title: "Wall Tag", label: "Inspect Graffiti Tag" },
                    { id: "lowrider_trunk", x: 620, y: 410, width: 70, height: 50, title: "Lowrider Trunk", label: "Inspect Lowrider", stealth: true }
                ]
            },
            control_room: {
                name: "Control Room (Hub)",
                doors: [
                    { id: "door_exit_street", x: 370, y: 530, width: 60, height: 40, targetRoom: "outside", targetX: 400, targetY: 280, label: "Exit to Street" },
                    { id: "door_studio_booth", x: 720, y: 270, width: 40, height: 60, targetRoom: "studio_room", targetX: 100, targetY: 300, label: "Enter Studio Booth" }
                ],
                objects: [
                    { id: "studio_monitors", x: 340, y: 180, width: 120, height: 50, title: "Studio Monitors", label: "Play Dropped Discography" },
                    { id: "mixing_desk", x: 330, y: 240, width: 140, height: 60, title: "Mixing Console", label: "Open Audio Visualizer" },
                    { id: "couch_phone", x: 120, y: 380, width: 80, height: 50, title: "Studio Couch Phone", label: "Access Social Links" },
                    { id: "wall_records", x: 520, y: 160, width: 140, height: 40, title: "Wall Discography & Release Dates", label: "Inspect Release Dates" }
                ]
            },
            studio_room: {
                name: "Studio Room",
                doors: [
                    { id: "door_control_hub", x: 40, y: 270, width: 40, height: 60, targetRoom: "control_room", targetX: 660, targetY: 300, label: "Return to Control Room" }
                ],
                objects: [
                    { id: "mic_headphones", x: 400, y: 260, width: 50, height: 60, title: "Vocal Mic & Headphones", label: "Preview New Music Drops" },
                    { id: "session_gear", x: 220, y: 250, width: 80, height: 60, title: "Tracking Rig & Session Notes", label: "Read Session & Lyric Notes" },
                    { id: "interview_camera", x: 600, y: 350, width: 50, height: 50, title: "0.5x Interview Camera Rig", label: "View Press & Visual Rollout" }
                ]
            }
        };

        // Render Functions
        function drawPlayer() {
            // Body / Fit (Dark Streetwear)
            ctx.fillStyle = '#111116';
            ctx.fillRect(state.player.x - 12, state.player.y - 28, 24, 28);

            // Head / Skin (White tone)
            ctx.fillStyle = '#f5d6c6';
            ctx.fillRect(state.player.x - 8, state.player.y - 36, 16, 12);

            // Dark Curls
            ctx.fillStyle = '#1a110b';
            ctx.beginPath();
            ctx.arc(state.player.x - 6, state.player.y - 36, 4, 0, Math.PI * 2);
            ctx.arc(state.player.x, state.player.y - 38, 5, 0, Math.PI * 2);
            ctx.arc(state.player.x + 6, state.player.y - 36, 4, 0, Math.PI * 2);
            ctx.fill();
        }

                // Upgraded Detailed Pixel-Art Render Engine
        function drawRoom() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const activeRoom = rooms[state.currentRoom];

            // Render Floor & Walls Background
            if (state.currentRoom === 'outside') {
                ctx.fillStyle = '#181820'; // Dark night sky / outside background
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Brick wall texture lines on building
                ctx.fillStyle = '#2d2528';
                ctx.fillRect(100, 80, 600, 270);
                ctx.strokeStyle = '#231d20';
                for(let i = 100; i < 350; i += 20) {
                    ctx.beginPath(); ctx.moveTo(100, i); ctx.lineTo(700, i); ctx.stroke();
                }

                // Street Asphalt
                ctx.fillStyle = '#0f0f14';
                ctx.fillRect(0, 350, canvas.width, 250);
                // Road dashes
                ctx.fillStyle = '#333';
                for(let x = 50; x < canvas.width; x += 100) {
                    ctx.fillRect(x, 470, 40, 4);
                }
            } else {
                // Studio Interior Floor (Wood plank grid look)
                ctx.fillStyle = '#1e1c24';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#15131a';
                for(let x = 0; x < canvas.width; x += 40) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                // Studio Acoustic Back Wall
                ctx.fillStyle = '#121118';
                ctx.fillRect(40, 30, 720, 180);
                // Acoustic foam panel lines
                ctx.strokeStyle = '#1a1822';
                for(let x = 60; x < 740; x += 60) {
                    ctx.strokeRect(x, 40, 45, 160);
                }
            }

            // Render Interactive Door Frameworks
            activeRoom.doors.forEach(door => {
                ctx.fillStyle = '#3a324a';
                ctx.fillRect(door.x, door.y, door.width, door.height);
                ctx.fillStyle = '#5a4d6e';
                ctx.fillRect(door.x + 4, door.y + 4, door.width - 8, door.height - 8);
                // Door knob/handle
                ctx.fillStyle = '#a28bc2';
                ctx.fillRect(door.x + 8, door.y + door.height / 2, 4, 8);
            });

            // Render Detailed Room Props
            activeRoom.objects.forEach(obj => {
                ctx.save();
                if (obj.id === 'event_flyer') {
                    // Detailed Flyer Poster
                    ctx.fillStyle = '#f5f5f0';
                    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                    ctx.fillStyle = '#fa243c'; // Red accent header
                    ctx.fillRect(obj.x, obj.y, obj.width, 10);
                    ctx.fillStyle = '#111';
                    ctx.fillRect(obj.x + 5, obj.y + 15, obj.width - 10, 4);
                    ctx.fillRect(obj.x + 5, obj.y + 25, obj.width - 15, 3);
                    ctx.fillRect(obj.x + 5, obj.y + 32, obj.width - 10, 3);
                } else if (obj.id === 'mdm_graffiti') {
                    // MDM Graffiti Tag
                    ctx.fillStyle = '#00ffcc';
                    ctx.font = 'bold 14px monospace';
                    ctx.fillText("MDM", obj.x, obj.y + 20);
                } else if (obj.id === 'lowrider_trunk') {
                    // Detailed Lowrider Rear & Trunk
                    ctx.fillStyle = '#16161f';
                    ctx.fillRect(obj.x - 70, obj.y, 140, 45); // Car body
                    ctx.fillStyle = '#222';
                    ctx.beginPath(); // Tires
                    ctx.arc(obj.x - 45, obj.y + 45, 12, 0, Math.PI * 2);
                    ctx.arc(obj.x + 45, obj.y + 45, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#silver'; // Chrome bumper
                    ctx.fillRect(obj.x - 65, obj.y + 35, 130, 6);
                } else if (obj.id === 'studio_monitors') {
                    // Studio Monitor Speakers (Dual speakers with cones)
                    ctx.fillStyle = '#1a1a24';
                    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                    // Left Speaker Cones
                    ctx.fillStyle = '#333';
                    ctx.beginPath(); ctx.arc(obj.x + 30, obj.y + 25, 16, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(obj.x + 30, obj.y + 25, 6, 0, Math.PI * 2); ctx.fill(); // Tweeter
                    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(obj.x + 30, obj.y + 25, 12, 0, Math.PI * 2); ctx.fill();
                    // Right Speaker Cones
                    ctx.fillStyle = '#333';
                    ctx.beginPath(); ctx.arc(obj.x + 90, obj.y + 25, 16, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(obj.x + 90, obj.y + 25, 6, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(obj.x + 90, obj.y + 25, 12, 0, Math.PI * 2); ctx.fill();
                } else if (obj.id === 'mixing_desk') {
                    // Mixing Console with Faders & Knobs
                    ctx.fillStyle = '#22222d';
                    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                    ctx.strokeStyle = '#444';
                    ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
                    // Mixing knobs & fader channels
                    for(let k = obj.x + 15; k < obj.x + obj.width - 15; k += 20) {
                        ctx.fillStyle = '#7289da';
                        ctx.fillRect(k, obj.y + 10, 4, 12); // Knob
                        ctx.fillStyle = '#fa243c';
                        ctx.fillRect(k + 1, obj.y + 35, 2, 18); // Fader line
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(k - 1, obj.y + 42, 6, 6); // Fader cap
                    }
                } else if (obj.id === 'couch_phone') {
                    // Actual Couch / Sofa with Phone on it
                    ctx.fillStyle = '#2b2633'; // Couch base
                    ctx.fillRect(obj.x, obj.y + 15, obj.width, obj.height - 15);
                    ctx.fillStyle = '#383142'; // Cushions
                    ctx.fillRect(obj.x + 5, obj.y + 10, 32, 30);
                    ctx.fillRect(obj.x + 43, obj.y + 10, 32, 30);
                    ctx.fillStyle = '#1f1b26'; // Couch backrest
                    ctx.fillRect(obj.x, obj.y, obj.width, 15);
                    // Phone laying on the couch
                    ctx.fillStyle = '#0ff';
                    ctx.fillRect(obj.x + 55, obj.y + 22, 10, 16);
                } else if (obj.id === 'wall_records') {
                    // Framed Vinyl Records on Wall
                    ctx.fillStyle = '#252028';
                    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                    ctx.strokeStyle = '#444';
                    ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
                    // Record frames inside
                    ctx.fillStyle = '#111';
                    ctx.fillRect(obj.x + 10, obj.y + 8, 24, 24);
                    ctx.fillRect(obj.x + 55, obj.y + 8, 24, 24);
                    ctx.fillRect(obj.x + 100, obj.y + 8, 24, 24);
                    // Vinyl center labels
                    ctx.fillStyle = '#7289da';
                    ctx.beginPath(); ctx.arc(obj.x + 22, obj.y + 20, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#fa243c';
                    ctx.beginPath(); ctx.arc(obj.x + 67, obj.y + 20, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#0ff';
                    ctx.beginPath(); ctx.arc(obj.x + 112, obj.y + 20, 4, 0, Math.PI * 2); ctx.fill();
                } else if (obj.id === 'mic_headphones') {
                    // Vocal Mic Stand & Headphones
                    ctx.fillStyle = '#444'; // Stand pole
                    ctx.fillRect(obj.x + 22, obj.y + 10, 4, 50);
                    ctx.fillStyle = '#aaa'; // Mic head
                    ctx.fillRect(obj.x + 18, obj.y, 12, 14);
                    // Headphones hanging nearby
                    ctx.strokeStyle = '#7289da';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(obj.x + 38, obj.y + 25, 10, Math.PI, Math.PI * 2); ctx.stroke();
                } else if (obj.id === 'session_gear') {
                    // Tracking Rig & Session Note Sheet on desk
                    ctx.fillStyle = '#2a2833';
                    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                    ctx.fillStyle = '#fff'; // Note paper
                    ctx.fillRect(obj.x + 15, obj.y + 10, 30, 40);
                    ctx.fillStyle = '#333'; // Text lines on paper
                    ctx.fillRect(obj.x + 18, obj.y + 16, 24, 2);
                    ctx.fillRect(obj.x + 18, obj.y + 22, 20, 2);
                    ctx.fillRect(obj.x + 18, obj.y + 28, 22, 2);
                } else if (obj.id === 'interview_camera') {
                    // Interview Camera on Tripod
                    ctx.fillStyle = '#333'; // Camera body
                    ctx.fillRect(obj.x + 10, obj.y + 10, 25, 18);
                    ctx.fillStyle = '#0ff'; // Lens
                    ctx.fillRect(obj.x + 35, obj.y + 14, 8, 10);
                    ctx.strokeStyle = '#555'; // Tripod legs
                    ctx.beginPath();
                    ctx.moveTo(obj.x + 22, obj.y + 28); ctx.lineTo(obj.x + 5, obj.y + 50);
                    ctx.moveTo(obj.x + 22, obj.y + 28); ctx.lineTo(obj.x + 40, obj.y + 50);
                    ctx.stroke();
                }
            });

            drawPlayer();
            checkProximity();
            ctx.restore();
        }
        // Proximity Engine for Doorways & Objects
        function checkProximity() {
            const activeRoom = rooms[state.currentRoom];
            state.nearObject = null;

            // Check Doors First
            for (let door of activeRoom.doors) {
                if (isColliding(state.player, door)) {
                    state.nearObject = { type: 'door', data: door };
                    drawInteractionPrompt(`Press [E] to ${door.label}`);
                    return;
                }
            }

            // Check Interactive Objects
            for (let obj of activeRoom.objects) {
                if (isColliding(state.player, obj)) {
                    state.nearObject = { type: 'object', data: obj };
                    if (!obj.stealth) {
                        drawInteractionPrompt(`Press [E] to ${obj.label}`);
                    }
                    return;
                }
            }
        }

        function isColliding(p, target) {
            return (
                p.x - p.width / 2 < target.x + target.width &&
                p.x + p.width / 2 > target.x &&
                p.y - p.height / 2 < target.y + target.height &&
                p.y + p.height / 2 > target.y
            );
        }

        function drawInteractionPrompt(text) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(canvas.width / 2 - 140, canvas.height - 60, 280, 32);
            ctx.strokeStyle = '#7289da';
            ctx.strokeRect(canvas.width / 2 - 140, canvas.height - 60, 280, 32);
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText(text, canvas.width / 2, canvas.height - 40);
        }

        // Interaction Handler Dispatcher
        function triggerInteraction() {
            AudioEngine.playTone(600, 'sine', 0.1);
            if (!state.nearObject) return;

            if (state.nearObject.type === 'door') {
                const door = state.nearObject.data;
                state.currentRoom = door.targetRoom;
                state.player.x = door.targetX;
                state.player.y = door.targetY;
                document.getElementById('room-indicator').innerText = `Zone: ${rooms[state.currentRoom].name}`;
            } else if (state.nearObject.type === 'object') {
                const obj = state.nearObject.data;
                const modal = document.getElementById('game-modal');
                const title = document.getElementById('modal-title');
                const body = document.getElementById('modal-body');

                title.innerText = obj.title;
                
                // Event Dispatcher for Part 2 Dynamic Modal Content
                const event = new CustomEvent('openStudioModal', { detail: { id: obj.id, room: state.currentRoom } });
                window.dispatchEvent(event);

                modal.style.display = 'block';
            }
        }

        // Movement Engine
        function updatePlayerPosition() {
            if (state.keys.up && state.player.y > 180) state.player.y -= state.player.speed;
            if (state.keys.down && state.player.y < 540) state.player.y += state.player.speed;
            if (state.keys.left && state.player.x > 50) state.player.x -= state.player.speed;
            if (state.keys.right && state.player.x < 750) state.player.x += state.player.speed;
        }

        function gameLoop() {
            updatePlayerPosition();
            drawRoom();
            requestAnimationFrame(gameLoop);
        }

        // Input Listener Bindings
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') state.keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') state.keys.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = true;
            if (e.key === 'e' || e.key === 'E' || e.key === ' ') triggerInteraction();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') state.keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') state.keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = false;
        });

        // Touch Control Listeners
        document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); state.keys.up = true; });
        document.getElementById('btn-up').addEventListener('touchend', (e) => { e.preventDefault(); state.keys.up = false; });
        document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); state.keys.down = true; });

        document.getElementById('btn-right').addEventListener('touchend', (e) => { e.preventDefault(); state.keys.right = false; });
        document.getElementById('btn-interact').addEventListener('click', triggerInteraction);

        document.getElementById('modal-close').addEventListener('click', () => {
            document.getElementById('game-modal').style.display = 'none';
        });

        // Start Game Engine
        requestAnimationFrame(gameLoop);
