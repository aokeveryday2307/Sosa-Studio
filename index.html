<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sosa's Studio // 2D Pixel Experience</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #08080c;
            color: #f0f0f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            align-items: center;
        }
        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #111116;
            border-bottom: 1px solid #1f1f2b;
        }
        h1 {
            font-size: 15px;
            letter-spacing: 2px;
            color: #b084ff;
            font-weight: 800;
        }
        .status-badge {
            font-size: 11px;
            background: #1a1a24;
            color: #a0a0b0;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #2a2a38;
        }
        .canvas-container {
            width: 100%;
            max-width: 500px;
            flex-grow: 1;
            background: #050508;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid #1f1f2b;
        }
        canvas {
            background: #09090e;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .controls-panel {
            width: 100%;
            max-width: 500px;
            padding: 16px;
            background: #111116;
            display: flex;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(3, 44px);
            gap: 4px;
        }
        .dpad-btn {
            background: #1a1a24;
            border: 1px solid #2a2a38;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .dpad-btn:active {
            background: #b084ff;
            color: #08080c;
        }
        .d-up { grid-column: 2; grid-row: 1; }
        .d-left { grid-column: 1; grid-row: 2; }
        .d-center { grid-column: 2; grid-row: 2; background: #111116; border: none; pointer-events: none; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down { grid-column: 2; grid-row: 3; }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        .action-btn {
            background: #b084ff;
            color: #08080c;
            border: none;
            padding: 14px;
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(176, 132, 255, 0.2);
        }
        .action-btn:active {
            transform: scale(0.98);
            background: #9d6aff;
        }
        .secondary-btn {
            background: #1a1a24;
            color: #f0f0f5;
            border: 1px solid #2a2a38;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>SOSA // STUDIO</h1>
        <div class="status-badge" id="mode-indicator">Control Room</div>
    </header>
    
    <div class="canvas-container">
        <canvas id="gameCanvas" width="384" height="224"></canvas>
    </div>

    <div class="controls-panel">
        <div class="dpad">
            <button class="dpad-btn d-up" id="btn-up">▲</button>
            <button class="dpad-btn d-left" id="btn-left">◀</button>
            <div class="dpad-btn d-center"></div>
            <button class="dpad-btn d-right" id="btn-right">▶</button>
            <button class="dpad-btn d-down" id="btn-down">▼</button>
        </div>
        <div class="action-buttons">
            <button class="action-btn" id="btn-interact">Interact</button>
            <button class="action-btn secondary-btn" id="btn-beat">Toggle Beat</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state & multi-room setup
        let currentRoom = 'control'; // 'control', 'booth', 'lounge'
        
        let player = {
            x: 192,
            y: 112,
            size: 16,
            speed: 2.2,
            color: '#b084ff',
            dir: 'down'
        };

        let keys = { up: false, down: false, left: false, right: false };
        let isBeatPlaying = false;
        let audioCtx = null;
        let beatInterval = null;
        let interactionMessage = "";
        let interactionTimer = 0;

        // Controls binding
        function setupButton(id, keyName) {
            const btn = document.getElementById(id);
            ['mousedown', 'touchstart'].forEach(evt => {
                btn.addEventListener(evt, (e) => { e.preventDefault(); keys[keyName] = true; });
            });
            ['mouseup', 'touchend', 'touchcancel'].forEach(evt => {
                btn.addEventListener(evt, (e) => { e.preventDefault(); keys[keyName] = false; });
            });
        }

        setupButton('btn-up', 'up');
        setupButton('btn-down', 'down');
        setupButton('btn-left', 'left');
        setupButton('btn-right', 'right');

        document.getElementById('btn-interact').addEventListener('click', () => {
            triggerInteraction();
        });

        document.getElementById('btn-beat').addEventListener('click', () => {
            isBeatPlaying = !isBeatPlaying;
            const beatBtn = document.getElementById('btn-beat');
            const indicator = document.getElementById('mode-indicator');
            
            if (isBeatPlaying) {
                beatBtn.textContent = "Stop Beat";
                indicator.textContent = "Beat Playing ♫";
                startAudioLoop();
            } else {
                beatBtn.textContent = "Toggle Beat";
                indicator.textContent = capitalize(currentRoom) + " Room";
                stopAudioLoop();
            }
        });

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1) + " Room";
        }

        function triggerInteraction() {
            const indicator = document.getElementById('mode-indicator');
            if (currentRoom === 'control') {
                showPopup("Mixing console active: EQ adjusted & levels locked in.");
            } else if (currentRoom === 'booth') {
                showPopup("Mic live: Recording vocal take in the booth...");
            } else if (currentRoom === 'lounge') {
                showPopup("Chilling in the lounge, brainstorming the next rollout.");
            }
        }

        function showPopup(msg) {
            interactionMessage = msg;
            interactionTimer = 180;
            const indicator = document.getElementById('mode-indicator');
            indicator.textContent = msg;
            setTimeout(() => {
                if (interactionTimer <= 0) {
                    indicator.textContent = capitalize(currentRoom) + " Room";
                }
            }, 3000);
        }

        function startAudioLoop() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            let step = 0;
            beatInterval = setInterval(() => {
                if (!isBeatPlaying) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = (step % 4 === 0) ? 'square' : 'triangle';
                osc.frequency.setValueAtTime((step % 4 === 0) ? 98 : 196, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
                step = (step + 1) % 8;
            }, 240);
        }

        function stopAudioLoop() {
            if (beatInterval) clearInterval(beatInterval);
        }

        function update() {
            if (keys.up) player.y -= player.speed;
            if (keys.down) player.y += player.speed;
            if (keys.left) player.x -= player.speed;
            if (keys.right) player.x += player.speed;

            if (currentRoom === 'control') {
                if (player.x < 16) player.x = 16;
                if (player.x > canvas.width - 32) player.x = canvas.width - 32;
                if (player.y < 16) player.y = 16;
                if (player.y > canvas.height - 32) player.y = canvas.height - 32;

                // Door to Booth (Right)
                if (player.x > canvas.width - 35 && player.y > 80 && player.y < 130) {
                    currentRoom = 'booth';
                    player.x = 24;
                    player.y = 112;
                    document.getElementById('mode-indicator').textContent = "Vocal Booth";
                }
                // Door to Lounge (Left)
                else if (player.x < 20 && player.y > 80 && player.y < 130) {
                    currentRoom = 'lounge';
                    player.x = canvas.width - 40;
                    player.y = 112;
                    document.getElementById('mode-indicator').textContent = "Lounge Area";
                }
            } else if (currentRoom === 'booth') {
                if (player.x < 16) {
                    currentRoom = 'control';
                    player.x = canvas.width - 45;
                    player.y = 105;
                    document.getElementById('mode-indicator').textContent = "Control Room";
                }
                if (player.x > canvas.width - 32) player.x = canvas.width - 32;
                if (player.y < 16) player.y = 16;
                if (player.y > canvas.height - 32) player.y = canvas.height - 32;
            } else if (currentRoom === 'lounge') {
                if (player.x > canvas.width - 32) {
                    currentRoom = 'control';
                    player.x = 35;
                    player.y = 105;
                    document.getElementById('mode-indicator').textContent = "Control Room";
                }
                if (player.x < 16) player.x = 16;
                if (player.y < 16) player.y = 16;
                if (player.y > canvas.height - 32) player.y = canvas.height - 32;
            }

            if (interactionTimer > 0) interactionTimer--;
        }

        function drawBackground() {
            ctx.fillStyle = '#09090e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#13131c';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 16) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 16) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function drawControlRoom() {
            ctx.strokeStyle = '#252535';
            ctx.lineWidth = 4;
            ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);

            // Mixing Desk
            ctx.fillStyle = '#171722';
            ctx.fillRect(112, 60, 160, 50);
            ctx.strokeStyle = '#323246';
            ctx.strokeRect(112, 60, 160, 50);

            // Desk Gear Details
            ctx.fillStyle = '#b084ff';
            ctx.fillRect(124, 72, 24, 12);
            ctx.fillRect(156, 72, 16, 12);
            ctx.fillStyle = '#ff84e8';
            ctx.fillRect(184, 70, 40, 16);

            // Studio Monitors
            ctx.fillStyle = '#12121a';
            ctx.fillRect(80, 55, 24, 40);
            ctx.fillRect(280, 55, 24, 40);
            ctx.fillStyle = '#4a4a5e';
            ctx.beginPath(); ctx.arc(92, 75, 6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(292, 75, 6, 0, Math.PI * 2); ctx.fill();

            // Doors
            ctx.fillStyle = '#b084ff';
            ctx.fillRect(canvas.width - 12, 84, 8, 48);
            ctx.fillRect(4, 84, 8, 48);
        }

        function drawBoothRoom() {
            ctx.strokeStyle = '#302242';
            ctx.lineWidth = 4;
            ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);

            // Mic Stand & Pop Filter
            ctx.fillStyle = '#171722';
            ctx.fillRect(180, 80, 24, 60);
            ctx.fillStyle = '#b084ff';
            ctx.fillRect(188, 60, 8, 20);
            ctx.fillStyle = '#555';
            ctx.beginPath(); ctx.arc(192, 56, 10, 0, Math.PI * 2); ctx.stroke();

            ctx.fillStyle = '#ff84e8';
            ctx.fillRect(4, 84, 8, 48);
        }

        function drawLoungeRoom() {
            ctx.strokeStyle = '#182535';
            ctx.lineWidth = 4;
            ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);

            // Lounge Couch Setup
            ctx.fillStyle = '#202030';
            ctx.fillRect(140, 80, 100, 48);
            ctx.fillStyle = '#b084ff';
            ctx.fillRect(160, 92, 60, 24);

            ctx.fillStyle = '#84ffff';
            ctx.fillRect(canvas.width - 12, 84, 8, 48);
        }

        function drawPlayer() {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.arc(player.x + player.size/2, player.y + player.size - 2, 6, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);
            
            // Curly hair head detail
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 2, player.y + 1, 12, 5);
        }

        function loop() {
            update();
            drawBackground();

            if (currentRoom === 'control') drawControlRoom();
            else if (currentRoom === 'booth') drawBoothRoom();
            else if (currentRoom === 'lounge') drawLoungeRoom();

            drawPlayer();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
