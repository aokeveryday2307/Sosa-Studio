<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AO Sosa // Studio Experience</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #hud-bar {
            width: 100%;
            padding: 10px 16px;
            background: #14161d;
            border-bottom: 2px solid #232733;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #hud-title {
            color: #00f0ff;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }
        #hud-zone {
            color: #8a8f9e;
        }
        canvas {
            background-color: #000;
            display: block;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #232733;
        }
        #controls-container {
            width: 100%;
            max-width: 800px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #14161d;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(3, 44px);
            gap: 4px;
        }
        .dpad-btn {
            background: #232733;
            border: 1px solid #3a3f52;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .dpad-btn:active {
            background: #00f0ff;
            color: #000;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        
        .action-btn {
            padding: 14px 24px;
            background: #00f0ff;
            color: #0d0e12;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            touch-action: manipulation;
            opacity: 0.7;
        }
        .action-btn:active {
            transform: scale(0.96);
            background: #fff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud-bar">
        <span id="hud-title">AO SOSA // STUDIO</span>
        <span id="hud-zone">Zone: Control Room</span>
    </div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="controls-container">
        <div class="dpad">
            <button class="dpad-btn" id="btn-up">▲</button>
            <button class="dpad-btn" id="btn-left">◀</button>
            <button class="dpad-btn" id="btn-right">▶</button>
            <button class="dpad-btn" id="btn-down">▼</button>
        </div>
        <button class="action-btn" id="btn-interact">[E] INTERACT</button>
    </div>
</div>

<script>
    // ==========================================
    // PART 1: CORE CANVAS SETUP & SAFE STORAGE
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Razor-Sharp Pixel Art Engine (Zero Blur)
    ctx.imageSmoothingEnabled = false;

    // Global Game State (3-Room Architecture)
    const state = {
        currentRoom: 'control_room', // 'street', 'control_room', 'studio_booth'
        player: {
            x: 380,
            y: 430,
            width: 36,
            height: 52, // Accurate human proportions
            speed: 4,
            direction: 'down',
            isMoving: false
        },
        keys: {},
        nearObject: null,
        adminUnlocked: false
    };

    // Safe Dynamic LocalStorage Initializer
    function initLocalStorage() {
        if (!localStorage.getItem('sosa_studio_data')) {
            localStorage.setItem('sosa_studio_data', JSON.stringify({
                trunkSnippet: "https://example.com/unreleased-snippet.mp3",
                latestDropSnippet: "https://example.com/latest-drop.mp3",
                visualizerUrl: "https://example.com/visualizer",
                interviewUrl: "https://example.com/interview",
                socials: {
                    tiktok: "https://tiktok.com/@aososa",
                    instagram: "https://instagram.com/@aososa",
                    soundcloud: "https://soundcloud.com/aososa"
                },
                records: [
                    { title: "EVERYTHING WILL BE AOK", date: "AUG 2026", cover: "#00f0ff" },
                    { title: "LUCIANO / SOSAPAIN", date: "UPCOMING", cover: "#ff0055" }
                ],
                lyrics: "AO Sosa // 2026 session notes...\n- Melodic trap hooks on the beat drop\n- Keep the 808s hitting heavy\n- Everything will be aok."
            }));
        }
        if (!localStorage.getItem('sosa_admin_settings')) {
            localStorage.setItem('sosa_admin_settings', JSON.stringify({ code: '2323' }));
        }
    }
    initLocalStorage();

    function getStudioData() {
        try {
            return JSON.parse(localStorage.getItem('sosa_studio_data'));
        } catch(e) {
            return {};
        }
    }
    // ==========================================
    // PART 2: 3-ROOM RENDERER (STREET, CONTROL, BOOTH)
    // ==========================================
    function drawRoom() {
        if (state.currentRoom === 'street') {
            drawStreetZone();
        } else if (state.currentRoom === 'control_room') {
            drawControlRoom();
        } else if (state.currentRoom === 'studio_booth') {
            drawStudioBooth();
        }
    }

    // 1. STREET ZONE RENDERER
    function drawStreetZone() {
        // Night Sky & Skyline
        ctx.fillStyle = '#08090c';
        ctx.fillRect(0, 0, canvas.width, 260);

        ctx.fillStyle = '#101218';
        ctx.fillRect(40, 120, 80, 140);
        ctx.fillRect(160, 80, 110, 180);
        ctx.fillRect(520, 100, 90, 160);
        ctx.fillRect(650, 130, 100, 130);

        // Brick Exterior & Studio Entrance Door
        ctx.fillStyle = '#22252e';
        ctx.fillRect(0, 260, canvas.width, 160);

        ctx.fillStyle = '#14161d';
        ctx.fillRect(80, 340, 50, 80);
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(80, 340, 50, 80);

        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(75, 330, 60, 6);

        // Prominent MDM Graffiti Wall (Admin PIN 2323 Trigger)
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(320, 280, 160, 70);

        ctx.fillStyle = '#ff0055';
        ctx.font = '900 42px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 10;
        ctx.fillText("M D M", 400, 330);
        ctx.shadowBlur = 0;

        ctx.fillRect(360, 332, 4, 12);
        ctx.fillRect(410, 332, 4, 18);

        // Sidewalk & Roadway
        ctx.fillStyle = '#3a3e4d';
        ctx.fillRect(0, 420, canvas.width, 40);
        ctx.fillStyle = '#555b70';
        ctx.fillRect(0, 458, canvas.width, 4);

        ctx.fillStyle = '#121317';
        ctx.fillRect(0, 462, canvas.width, 138);

        ctx.fillStyle = '#ffcc00';
        for (let x = 20; x < canvas.width; x += 90) {
            ctx.fillRect(x, 525, 50, 6);
        }

        // Slammed Lowrider (Trunk interactive snippet)
        drawLowrider(520, 475);
    }

    // 2. CONTROL ROOM RENDERER
    function drawControlRoom() {
        // Back Wall & Acoustic Foam
        ctx.fillStyle = '#181a20';
        ctx.fillRect(0, 0, canvas.width, 420);

        ctx.strokeStyle = '#22252e';
        ctx.lineWidth = 1;
        for (let y = 0; y < 420; y += 20) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
        for (let y = 0; y < 420; y += 20) {
            let offset = (y / 20) % 2 === 0 ? 0 : 25;
            for (let x = offset; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 20); ctx.stroke();
            }
        }

        drawAcousticPanels(30, 60, 80, 140);

        // Framed Wall Records (Release dates, titles, cover art)
        let data = getStudioData();
        drawFramedRecord(140, 80, data.records[0]?.title || "EVERYTHING AOK", data.records[0]?.date || "AUG 2026", data.records[0]?.cover || "#00f0ff");
        drawFramedRecord(260, 80, data.records[1]?.title || "LUCIANO", data.records[1]?.date || "UPCOMING", data.records[1]?.cover || "#ff0055");

        // Studio Glass Window looking into Studio Booth
        ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
        ctx.fillRect(520, 100, 220, 160);
        ctx.strokeStyle = '#3a3f52';
        ctx.lineWidth = 4;
        ctx.strokeRect(520, 100, 220, 160);
        ctx.beginPath();
        ctx.moveTo(630, 100); ctx.lineTo(630, 260);
        ctx.moveTo(520, 180); ctx.lineTo(740, 180);
        ctx.stroke();

        // Studio Floor & Area Rug
        ctx.fillStyle = '#2d2118';
        ctx.fillRect(0, 420, canvas.width, 180);

        ctx.strokeStyle = '#201711';
        for (let y = 420; y < canvas.width; y += 24) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        ctx.fillStyle = '#121318';
        ctx.fillRect(180, 450, 440, 130);
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(180, 450, 440, 130);

        // Left Door (To Studio Booth) & Right Door (To Street)
        drawDoor(40, 340, 46, 80, "STUDIO", "#ff0055");
        drawDoor(710, 340, 46, 80, "STREET", "#00f0ff");

        // Mixing Console & Monitors (Visualizer trigger)
        ctx.fillStyle = '#111216';
        ctx.fillRect(280, 370, 240, 70);
        ctx.fillStyle = '#090a0d';
        ctx.fillRect(290, 410, 220, 30);
        ctx.fillStyle = '#4a3b32';
        ctx.fillRect(270, 365, 260, 10);

        drawStudioSpeaker(285, 305);
        drawStudioSpeaker(485, 305);

        ctx.fillStyle = '#22252e';
        ctx.fillRect(340, 345, 120, 20);
        for (let i = 0; i < 6; i++) {
            ctx.fillStyle = (i % 2 === 0) ? '#00f0ff' : '#ff0055';
            ctx.fillRect(350 + (i * 18), 350, 4, 10);
        }

        // Leather Couch & Smartphone (Social Links)
        ctx.fillStyle = '#1c1e24';
        ctx.fillRect(60, 385, 130, 55);
        ctx.fillStyle = '#282c36';
        ctx.fillRect(55, 410, 140, 35);
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(65, 400, 20, 20);

        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(140, 420, 8, 12);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(141, 421, 6, 10);
    }

    // 3. LIVE STUDIO ROOM (RECORDING BOOTH) RENDERER
    function drawStudioBooth() {
        // Floor-to-Ceiling Acoustic Padding
        ctx.fillStyle = '#111216';
        ctx.fillRect(0, 0, canvas.width, 420);
        drawAcousticPanels(0, 0, canvas.width, 420);

        // Studio Glass Window looking back at Control Room
        ctx.fillStyle = 'rgba(10, 12, 16, 0.85)';
        ctx.fillRect(520, 80, 220, 140);
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(520, 80, 220, 140);
        ctx.fillStyle = '#00f0ff';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("CONTROL ROOM VIEW", 630, 150);

        // Studio Floor
        ctx.fillStyle = '#241b14';
        ctx.fillRect(0, 420, canvas.width, 180);

        // Door back to Control Room
        drawDoor(710, 340, 46, 80, "CONTROL", "#00f0ff");

        // Vocal Mic Stand & Pop Filter (Latest drop snippet)
        ctx.fillStyle = '#3a3f50';
        ctx.fillRect(250, 320, 6, 100);
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(253, 315, 12, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(253, 335, 16, 0, Math.PI); ctx.stroke();

        // Studio Camera (Interview link)
        ctx.fillStyle = '#222';
        ctx.fillRect(120, 340, 30, 24);
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath(); ctx.arc(135, 352, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#333';
        ctx.fillRect(125, 364, 20, 40);

        // Notebook & Desk (Lyrics & Thoughts)
        ctx.fillStyle = '#2a2218';
        ctx.fillRect(580, 380, 80, 40);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(605, 390, 24, 16);
        ctx.fillStyle = '#000';
        ctx.fillRect(608, 393, 8, 2);
        ctx.fillRect(608, 397, 12, 2);
    }

    // Helper Graphics
    function drawAcousticPanels(x, y, w, h) {
        ctx.strokeStyle = '#1e222d';
        ctx.lineWidth = 1;
        for (let px = x; px < x + w; px += 20) {
            for (let py = y; py < y + h; py += 20) {
                ctx.strokeRect(px, py, 20, 20);
                ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 20, py + 20); ctx.stroke();
            }
        }
    }

    function drawStudioSpeaker(x, y) {
        ctx.fillStyle = '#121317';
        ctx.fillRect(x, y, 30, 60);
        ctx.strokeStyle = '#2d3240';
        ctx.strokeRect(x, y, 30, 60);
        ctx.fillStyle = '#ffff00';
        ctx.beginPath(); ctx.arc(x + 15, y + 15, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3a3f50';
        ctx.beginPath(); ctx.arc(x + 15, y + 42, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath(); ctx.arc(x + 15, y + 42, 4, 0, Math.PI * 2); ctx.fill();
    }

    function drawFramedRecord(x, y, title, dateStr, glowColor) {
        ctx.fillStyle = '#101115';
        ctx.fillRect(x, y, 100, 75);
        ctx.strokeStyle = glowColor;
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, 100, 75);

        ctx.fillStyle = '#050505';
        ctx.beginPath(); ctx.arc(x + 35, y + 38, 24, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = glowColor;
        ctx.beginPath(); ctx.arc(x + 35, y + 38, 8, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 8px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(dateStr, x + 62, y + 30);
        ctx.fillStyle = '#8a8f9e';
        ctx.fillText("RELEASE", x + 62, y + 42);
    }

    function drawDoor(x, y, w, h, label, color) {
        ctx.fillStyle = '#3a3f50';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#181a22';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);

        ctx.fillStyle = '#ffd700';
        ctx.fillRect(x + 5, y + 42, 5, 5);

        ctx.fillStyle = color;
        ctx.fillRect(x + 8, y + 10, 30, 10);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 7px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, x + 23, y + 17);
    }

    function drawLowrider(x, y) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(x - 10, y + 36, 190, 10);

        ctx.fillStyle = '#800020';
        ctx.fillRect(x, y + 14, 170, 22);

        ctx.fillRect(x + 40, y, 85, 18);
        ctx.fillStyle = '#111318';
        ctx.fillRect(x + 45, y + 3, 35, 12);
        ctx.fillRect(x + 85, y + 3, 35, 12);

        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(x - 4, y + 22, 6, 12);
        ctx.fillRect(x + 168, y + 22, 6, 12);
        ctx.fillRect(x, y + 24, 170, 2);

        drawLowriderWheel(x + 30, y + 32);
        drawLowriderWheel(x + 135, y + 32);
    }

    function drawLowriderWheel(wx, wy) {
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(wx, wy, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(wx, wy, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#800020';
        ctx.beginPath(); ctx.arc(wx, wy, 2, 0, Math.PI * 2); ctx.fill();
    }
    // ==========================================
    // PART 3: MOVEMENT, PROXIMITY & PLAYER RENDERER
    // ==========================================

    // Keyboard Listeners
    window.addEventListener('keydown', (e) => {
        state.keys[e.key.toLowerCase()] = true;
        if (e.key === 'e' || e.key === 'E') {
            triggerInteraction();
        }
    });

    window.addEventListener('keyup', (e) => {
        state.keys[e.key.toLowerCase()] = false;
    });

    // Mobile D-Pad Touch/Click Listeners
    const bindTouchButton = (id, keyName) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); state.keys[keyName] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); state.keys[keyName] = false; });
        btn.addEventListener('mousedown', () => { state.keys[keyName] = true; });
        btn.addEventListener('mouseup', () => { state.keys[keyName] = false; });
        btn.addEventListener('mouseleave', () => { state.keys[keyName] = false; });
    };

    bindTouchButton('btn-up', 'arrowup');
    bindTouchButton('btn-down', 'arrowdown');
    bindTouchButton('btn-left', 'arrowleft');
    bindTouchButton('btn-right', 'arrowright');

    document.getElementById('btn-interact').addEventListener('click', () => {
        triggerInteraction();
    });

    // Update Player Coordinates & Room Boundaries
    function updatePlayer() {
        let moving = false;
        let p = state.player;

        if (state.keys['arrowup'] || state.keys['w']) { p.y -= p.speed; p.direction = 'up'; moving = true; }
        if (state.keys['arrowdown'] || state.keys['s']) { p.y += p.speed; p.direction = 'down'; moving = true; }
        if (state.keys['arrowleft'] || state.keys['a']) { p.x -= p.speed; p.direction = 'left'; moving = true; }
        if (state.keys['arrowright'] || state.keys['d']) { p.x += p.speed; p.direction = 'right'; moving = true; }

        p.isMoving = moving;

        // Room Boundary Collisions
        if (state.currentRoom === 'control_room') {
            if (p.x < 40) p.x = 40;
            if (p.x > canvas.width - 40 - p.width) p.x = canvas.width - 40 - p.width;
            if (p.y < 350) p.y = 350;
            if (p.y > 540) p.y = 540;
        } else if (state.currentRoom === 'street') {
            if (p.x < 20) p.x = 20;
            if (p.x > canvas.width - 20 - p.width) p.x = canvas.width - 20 - p.width;
            if (p.y < 380) p.y = 380;
            if (p.y > 540) p.y = 540;
        } else if (state.currentRoom === 'studio_booth') {
            if (p.x < 40) p.x = 40;
            if (p.x > canvas.width - 40 - p.width) p.x = canvas.width - 40 - p.width;
            if (p.y < 350) p.y = 350;
            if (p.y > 540) p.y = 540;
        }

        checkProximity();
    }

    // Proximity Detection Engine for All 3 Rooms
    function checkProximity() {
        let p = state.player;
        let pCenterX = p.x + p.width / 2;
        let pCenterY = p.y + p.height / 2;
        let interactBtn = document.getElementById('btn-interact');

        state.nearObject = null;

        if (state.currentRoom === 'control_room') {
            // Left Door to Studio Booth (x: 40 to 86, y: 340 to 420)
            if (Math.hypot(pCenterX - 63, pCenterY - 380) < 60) state.nearObject = 'door_to_booth';
            // Right Door to Street (x: 710 to 756, y: 340 to 420)
            if (Math.hypot(pCenterX - 733, pCenterY - 380) < 60) state.nearObject = 'door_to_street_from_control';
            // Mixing Console / Monitors
            if (Math.hypot(pCenterX - 400, pCenterY - 400) < 70) state.nearObject = 'mixing_console';
            // Wall Records
            if (Math.hypot(pCenterX - 200, pCenterY - 115) < 75) state.nearObject = 'wall_records';
            // Couch Phone (Socials)
            if (Math.hypot(pCenterX - 125, pCenterY - 415) < 55) state.nearObject = 'couch_phone';
        } 
        else if (state.currentRoom === 'street') {
            // Entrance Door back to Control Room (x: 80 to 130, y: 340 to 420)
            if (Math.hypot(pCenterX - 105, pCenterY - 380) < 60) state.nearObject = 'door_to_control_from_street';
            // MDM Graffiti Wall -> Admin Secret PIN (2323)
            if (Math.hypot(pCenterX - 400, pCenterY - 315) < 75) state.nearObject = 'mdm_graffiti_admin';
            // Lowrider Trunk (Unreleased Snippet)
            if (Math.hypot(pCenterX - 550, pCenterY - 490) < 65) state.nearObject = 'lowrider_trunk';
        }
        else if (state.currentRoom === 'studio_booth') {
            // Door back to Control Room
            if (Math.hypot(pCenterX - 733, pCenterY - 380) < 60) state.nearObject = 'door_to_control_from_booth';
            // Vocal Mic Stand (Latest Drop Snippet)
            if (Math.hypot(pCenterX - 253, pCenterY - 350) < 55) state.nearObject = 'vocal_mic';
            // Studio Camera (Interview)
            if (Math.hypot(pCenterX - 135, pCenterY - 370) < 55) state.nearObject = 'studio_camera';
            // Notebook (Lyrics & Thoughts)
            if (Math.hypot(pCenterX - 620, pCenterY - 400) < 50) state.nearObject = 'studio_notebook';
        }

        // Highlight Interaction Button when near active hotspot
        if (state.nearObject) {
            interactBtn.style.opacity = '1';
            interactBtn.style.boxShadow = '0 0 15px rgba(0, 240, 255, 0.6)';
        } else {
            interactBtn.style.opacity = '0.7';
            interactBtn.style.boxShadow = '0 0 10px rgba(0, 240, 255, 0.3)';
        }
    }

    // Render Player Avatar (Accurate Proportions, Curly Hair, Streetwear)
    function drawPlayer() {
        let p = state.player;

        // Drop Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(p.x + p.width / 2, p.y + p.height, p.width / 2, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // All-Black Neo-Noir Streetwear Outfit / Jacket
        ctx.fillStyle = '#111318';
        ctx.fillRect(p.x + 4, p.y + 16, 28, 26);

        // Pants
        ctx.fillStyle = '#181b22';
        ctx.fillRect(p.x + 6, p.y + 40, 10, 12);
        ctx.fillRect(p.x + 20, p.y + 40, 10, 12);

        // Face Skin Tone
        ctx.fillStyle = '#f2d3bc';
        ctx.fillRect(p.x + 10, p.y + 4, 16, 14);

        // Curly Hair Feature
        ctx.fillStyle = '#22160b';
        ctx.fillRect(p.x + 8, p.y, 20, 6);
        ctx.fillRect(p.x + 7, p.y + 3, 4, 6);
        ctx.fillRect(p.x + 25, p.y + 3, 4, 6);

        // Footwear
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(p.x + 5, p.y + 50, 10, 3);
        ctx.fillRect(p.x + 21, p.y + 50, 10, 3);
    }

    function triggerInteraction() {
        if (!state.nearObject) return;
        let data = getStudioData();

        // 1. Room Transition Doors
        if (state.nearObject === 'door_to_booth') {
            state.currentRoom = 'studio_booth';
            state.player.x = 680;
            state.player.y = 430;
            document.getElementById('hud-zone').textContent = 'Zone: Live Studio Booth';
        }
        else if (state.nearObject === 'door_to_street_from_control') {
            state.currentRoom = 'street';
            state.player.x = 120;
            state.player.y = 430;
            document.getElementById('hud-zone').textContent = 'Zone: Street Entrance';
        }
        else if (state.nearObject === 'door_to_control_from_street') {
            state.currentRoom = 'control_room';
            state.player.x = 100;
            state.player.y = 430;
            document.getElementById('hud-zone').textContent = 'Zone: Control Room';
        }
        else if (state.nearObject === 'door_to_control_from_booth') {
            state.currentRoom = 'control_room';
            state.player.x = 80;
            state.player.y = 430;
            document.getElementById('hud-zone').textContent = 'Zone: Control Room';
        }

        // 2. Street // Lowrider Trunk (Unreleased Snippet)
        else if (state.nearObject === 'lowrider_trunk') {
            alert("🚗 [LOWRIDER TRUNK] Playing secret unreleased track snippet...\n(Link: " + data.trunkSnippet + ")");
        }

        // 3. Street // MDM Graffiti Wall (Admin PIN 2323)
        else if (state.nearObject === 'mdm_graffiti_admin') {
            openAdminLoginModal();
        }

        // 4. Control Room // Mixing Console (Visualizer)
        else if (state.nearObject === 'mixing_console') {
            alert("🎛️ [STUDIO MONITORS] Launching AO Sosa Visualizer...\n(URL: " + data.visualizerUrl + ")");
        }

        // 5. Control Room // Wall Records (Releases, Dates, Cover Art)
        else if (state.nearObject === 'wall_records') {
            let info = data.records.map(r => `• ${r.title} (${r.date})`).join('\n');
            alert("📀 [OFFICIAL DISCOGRAPHY]\n\n" + info);
        }

        // 6. Control Room // Couch Phone (Social Links)
        else if (state.nearObject === 'couch_phone') {
            let s = data.socials;
            let choice = prompt(`📱 [PHONE - SOCIAL LINKS]\nEnter platform to open:\n1. TikTok (${s.tiktok})\n2. Instagram (${s.instagram})\n3. SoundCloud (${s.soundcloud})`, "1");
            if (choice === "1" || choice?.toLowerCase().includes("tik")) window.open(s.tiktok, '_blank');
            if (choice === "2" || choice?.toLowerCase().includes("insta")) window.open(s.instagram, '_blank');
            if (choice === "3" || choice?.toLowerCase().includes("sound")) window.open(s.soundcloud, '_blank');
        }

        // 7. Studio Booth // Vocal Mic (Latest Drop Snippet)
        else if (state.nearObject === 'vocal_mic') {
            alert("🎙️ [MIC STAND] Playing snippet of latest drop...\n(Link: " + data.latestDropSnippet + ")");
        }

        // 8. Studio Booth // Studio Camera (Interview)
        else if (state.nearObject === 'studio_camera') {
            alert("📹 [STUDIO CAMERA] Opening AO Sosa Interview feature...\n(URL: " + data.interviewUrl + ")");
        }

        // 9. Studio Booth // Notebook (Lyrics & Thoughts)
        else if (state.nearObject === 'studio_notebook') {
            alert("📓 [STUDIO NOTEBOOK // LYRICS & THOUGHTS]\n\n" + data.lyrics);
        }
    }

    function openAdminLoginModal() {
        let pin = prompt("Enter Secret Admin Passcode:");
        if (pin === null) return;

        let settings = JSON.parse(localStorage.getItem('sosa_admin_settings') || '{"code":"2323"}');
        
        if (pin === settings.code) {
            state.adminUnlocked = true;
            openAdminDashboard();
        } else {
            alert("Incorrect Passcode.");
        }
    }
