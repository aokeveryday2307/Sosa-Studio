<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AO Sosa // Studio Experience</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #0d0e12; color: #ffffff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; }
        #hud-bar { width: 100%; padding: 10px 16px; background: #14161d; border-bottom: 2px solid #232733; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
        #hud-title { color: #00f0ff; text-shadow: 0 0 5px rgba(0, 240, 255, 0.5); }
        #hud-zone { color: #8a8f9e; }
        canvas { background-color: #000; display: block; width: 100%; max-width: 800px; aspect-ratio: 4 / 3; image-rendering: pixelated; image-rendering: crisp-edges; border: 2px solid #232733; }
        #controls-container { width: 100%; max-width: 800px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: #14161d; }
        .dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px; }
        .dpad-btn { background: #232733; border: 1px solid #3a3f52; border-radius: 6px; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .dpad-btn:active { background: #00f0ff; color: #000; }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        .action-btn { padding: 14px 24px; background: #00f0ff; color: #0d0e12; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; letter-spacing: 1px; box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); touch-action: manipulation; opacity: 0.7; }
        .action-btn:active { transform: scale(0.96); background: #fff; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud-bar">
        <span id="hud-title">AO SOSA // STUDIO</span>
        <span id="hud-zone">Zone: Control Room</span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="controls-container">
        <div class="dpad">
            <button class="dpad-btn" id="btn-up">▲</button>
            <button class="dpad-btn" id="btn-left">◀</button>
            <button class="dpad-btn" id="btn-right">▶</button>
            <button class="dpad-btn" id="btn-down">▼</button>
        </div>
        <button class="action-btn" id="btn-interact">[E] INTERACT</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const state = {
        currentRoom: 'control_room',
        player: { x: 380, y: 430, width: 36, height: 52, speed: 4, direction: 'down', isMoving: false },
        keys: {},
        nearObject: null,
        adminUnlocked: false
    };

    function initLocalStorage() {
        if (!localStorage.getItem('sosa_studio_data')) {
            localStorage.setItem('sosa_studio_data', JSON.stringify({
                trunkSnippet: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                trunkOffset: 0,
                latestDropSnippet: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                latestOffset: 0,
                visualizerUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                interviewUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                socials: { tiktok: "https://tiktok.com/@aososa", instagram: "https://instagram.com/@aososa", soundcloud: "https://soundcloud.com/aososa" },
                records: [
                    { title: "EVERYTHING WILL BE AOK", date: "AUG 2026", cover: "#00f0ff" },
                    { title: "LUCIANO / SOSAPAIN", date: "UPCOMING", cover: "#ff0055" }
                ],
                lyrics: "AO Sosa // 2026 session notes...\n- Melodic trap hooks on the beat drop\n- Keep the 808s hitting heavy\n- Everything will be aok.",
                event: { title: "AO Sosa Live Showcase", date: "NOV 18, 2026", time: "8:00 PM", venue: "Underground Theatre, PA", link: "https://example.com/tickets" }
            }));
        }
        if (!localStorage.getItem('sosa_admin_settings')) {
            localStorage.setItem('sosa_admin_settings', JSON.stringify({ code: '2323' }));
        }
    }
    initLocalStorage();

    function getStudioData() {
        try { return JSON.parse(localStorage.getItem('sosa_studio_data')); } catch(e) { return {}; }
    }
</script>
<script>
    function drawRoom() {
        if (state.currentRoom === 'street') drawStreetZone();
        else if (state.currentRoom === 'control_room') drawControlRoom();
        else if (state.currentRoom === 'studio_booth') drawStudioBooth();
    }

    function drawStreetZone() {
        ctx.fillStyle = '#08090c'; ctx.fillRect(0, 0, canvas.width, 260);
        ctx.fillStyle = '#101218';
        ctx.fillRect(40, 120, 80, 140); ctx.fillRect(160, 80, 110, 180);
        ctx.fillRect(520, 100, 90, 160); ctx.fillRect(650, 130, 100, 130);

        // Outdoor Event Flyer on Brick Wall
        ctx.fillStyle = '#1c1e24'; ctx.fillRect(165, 140, 45, 60);
        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(165, 140, 45, 60);
        ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';
        ctx.fillText("LIVE SHOW", 187, 155);
        ctx.fillStyle = '#fff'; ctx.font = '6px monospace';
        ctx.fillText("FLYER", 187, 175);

        ctx.fillStyle = '#22252e'; ctx.fillRect(0, 260, canvas.width, 160);
        ctx.fillStyle = '#14161d'; ctx.fillRect(80, 340, 50, 80);
        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(80, 340, 50, 80);
        ctx.fillStyle = '#00f0ff'; ctx.fillRect(75, 330, 60, 6);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; ctx.fillRect(320, 280, 160, 70);
        ctx.fillStyle = '#ff0055'; ctx.font = '900 42px "Courier New", monospace'; ctx.textAlign = 'center';
        ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 10; ctx.fillText("M D M", 400, 330); ctx.shadowBlur = 0;
        ctx.fillRect(360, 332, 4, 12); ctx.fillRect(410, 332, 4, 18);

        ctx.fillStyle = '#3a3e4d'; ctx.fillRect(0, 420, canvas.width, 40);
        ctx.fillStyle = '#555b70'; ctx.fillRect(0, 458, canvas.width, 4);
        ctx.fillStyle = '#121317'; ctx.fillRect(0, 462, canvas.width, 138);
        ctx.fillStyle = '#ffcc00';
        for (let x = 20; x < canvas.width; x += 90) ctx.fillRect(x, 525, 50, 6);
        drawLowrider(520, 475);
    }

    function drawControlRoom() {
        ctx.fillStyle = '#181a20'; ctx.fillRect(0, 0, canvas.width, 420);
        ctx.strokeStyle = '#22252e'; ctx.lineWidth = 1;
        for (let y = 0; y < 420; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
        for (let y = 0; y < 420; y += 20) {
            let offset = (y / 20) % 2 === 0 ? 0 : 25;
            for (let x = offset; x < canvas.width; x += 50) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 20); ctx.stroke(); }
        }
        drawAcousticPanels(30, 60, 80, 140);

        let data = getStudioData();
        // Enlarged Wall Records for Legibility
        drawLargeRecord(100, 70, data.records[0]?.title || "EVERYTHING AOK", data.records[0]?.date || "AUG 2026", data.records[0]?.cover || "#00f0ff");
        drawLargeRecord(280, 70, data.records[1]?.title || "LUCIANO", data.records[1]?.date || "UPCOMING", data.records[1]?.cover || "#ff0055");

        ctx.fillStyle = 'rgba(0, 240, 255, 0.12)'; ctx.fillRect(520, 100, 220, 160);
        ctx.strokeStyle = '#3a3f52'; ctx.lineWidth = 4; ctx.strokeRect(520, 100, 220, 160);
        ctx.beginPath(); ctx.moveTo(630, 100); ctx.lineTo(630, 260); ctx.moveTo(520, 180); ctx.lineTo(740, 180); ctx.stroke();

        ctx.fillStyle = '#2d2118'; ctx.fillRect(0, 420, canvas.width, 180);
        ctx.fillStyle = '#121318'; ctx.fillRect(180, 450, 440, 130);
        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(180, 450, 440, 130);

        drawDoor(35, 335, 56, 85, "BOOTH", "#ff0055");
        drawDoor(705, 335, 56, 85, "STREET", "#00f0ff");

        ctx.fillStyle = '#111216'; ctx.fillRect(280, 370, 240, 70);
        ctx.fillStyle = '#090a0d'; ctx.fillRect(290, 410, 220, 30);
        ctx.fillStyle = '#4a3b32'; ctx.fillRect(270, 365, 260, 10);

        drawStudioSpeaker(285, 305); drawStudioSpeaker(485, 305);

        ctx.fillStyle = '#22252e'; ctx.fillRect(340, 345, 120, 20);
        for (let i = 0; i < 6; i++) {
            ctx.fillStyle = (i % 2 === 0) ? '#00f0ff' : '#ff0055';
            ctx.fillRect(350 + (i * 18), 350, 4, 10);
        }

        // Repositioned Couch on Rug away from Booth door
        ctx.fillStyle = '#1c1e24'; ctx.fillRect(130, 385, 120, 50);
        ctx.fillStyle = '#282c36'; ctx.fillRect(125, 405, 130, 32);
        ctx.fillStyle = '#ff0055'; ctx.fillRect(135, 395, 18, 18);
        ctx.fillStyle = '#00f0ff'; ctx.fillRect(205, 415, 8, 12);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(206, 416, 6, 10);
    }

    function drawStudioBooth() {
        ctx.fillStyle = '#111216'; ctx.fillRect(0, 0, canvas.width, 420);
        drawAcousticPanels(0, 0, canvas.width, 420);

        ctx.fillStyle = 'rgba(10, 12, 16, 0.85)'; ctx.fillRect(520, 80, 220, 140);
        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3; ctx.strokeRect(520, 80, 220, 140);
        ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
        ctx.fillText("CONTROL ROOM VIEW", 630, 150);

        ctx.fillStyle = '#241b14'; ctx.fillRect(0, 420, canvas.width, 180);
        drawDoor(705, 335, 56, 85, "CONTROL", "#00f0ff");

        ctx.fillStyle = '#3a3f50'; ctx.fillRect(250, 320, 6, 100);
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(253, 315, 12, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(253, 335, 16, 0, Math.PI); ctx.stroke();

        ctx.fillStyle = '#222'; ctx.fillRect(120, 340, 30, 24);
        ctx.fillStyle = '#00f0ff'; ctx.beginPath(); ctx.arc(135, 352, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#333'; ctx.fillRect(125, 364, 20, 40);

        ctx.fillStyle = '#2a2218'; ctx.fillRect(580, 380, 80, 40);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(605, 390, 24, 16);
        ctx.fillStyle = '#000'; ctx.fillRect(608, 393, 8, 2); ctx.fillRect(608, 397, 12, 2);
    }

    function drawAcousticPanels(x, y, w, h) {
        ctx.strokeStyle = '#1e222d'; ctx.lineWidth = 1;
        for (let px = x; px < x + w; px += 20) {
            for (let py = y; py < y + h; py += 20) {
                ctx.strokeRect(px, py, 20, 20);
                ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 20, py + 20); ctx.stroke();
            }
        }
    }

    function drawStudioSpeaker(x, y) {
        ctx.fillStyle = '#121317'; ctx.fillRect(x, y, 30, 60);
        ctx.strokeStyle = '#2d3240'; ctx.strokeRect(x, y, 30, 60);
        ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(x + 15, y + 15, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3a3f50'; ctx.beginPath(); ctx.arc(x + 15, y + 42, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#00f0ff'; ctx.beginPath(); ctx.arc(x + 15, y + 42, 4, 0, Math.PI * 2); ctx.fill();
    }

    function drawLargeRecord(x, y, title, dateStr, glowColor) {
        ctx.fillStyle = '#101115'; ctx.fillRect(x, y, 150, 90);
        ctx.strokeStyle = glowColor; ctx.lineWidth = 2; ctx.strokeRect(x, y, 150, 90);

        ctx.fillStyle = '#050505'; ctx.beginPath(); ctx.arc(x + 45, y + 45, 32, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = glowColor; ctx.beginPath(); ctx.arc(x + 45, y + 45, 10, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'left';
        ctx.fillText(title.substring(0, 16), x + 85, y + 34);
        ctx.fillStyle = '#00f0ff'; ctx.fillText(dateStr, x + 85, y + 54);
        ctx.fillStyle = '#8a8f9e'; ctx.font = '7px monospace'; ctx.fillText("DISC RELEASE", x + 85, y + 68);
    }

    function drawDoor(x, y, w, h, label, color) {
        ctx.fillStyle = '#3a3f50'; ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#181a22'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = '#ffd700'; ctx.fillRect(x + 6, y + 50, 6, 6);

        ctx.fillStyle = color; ctx.fillRect(x + 5, y + 12, w - 10, 16);
        ctx.fillStyle = '#000'; ctx.font = 'bold 10px "Courier New", monospace'; ctx.textAlign = 'center';
        ctx.fillText(label, x + (w / 2), y + 24);
    }

    function drawLowrider(x, y) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 10, y + 36, 190, 10);
        ctx.fillStyle = '#800020'; ctx.fillRect(x, y + 14, 170, 22);
        ctx.fillRect(x + 40, y, 85, 18);
        ctx.fillStyle = '#111318'; ctx.fillRect(x + 45, y + 3, 35, 12); ctx.fillRect(x + 85, y + 3, 35, 12);
        ctx.fillStyle = '#e0e0e0'; ctx.fillRect(x - 4, y + 22, 6, 12); ctx.fillRect(x + 168, y + 22, 6, 12);
        ctx.fillRect(x, y + 24, 170, 2);
        drawLowriderWheel(x + 30, y + 32); drawLowriderWheel(x + 135, y + 32);
    }

    function drawLowriderWheel(wx, wy) {
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(wx, wy, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(wx, wy, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#800020'; ctx.beginPath(); ctx.arc(wx, wy, 2, 0, Math.PI * 2); ctx.fill();
    }
</script>
<script>
    window.addEventListener('keydown', (e) => {
        state.keys[e.key.toLowerCase()] = true;
        if (e.key === 'e' || e.key === 'E') triggerInteraction();
    });

    window.addEventListener('keyup', (e) => {
        state.keys[e.key.toLowerCase()] = false;
    });

    const bindTouchButton = (id, keyName) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); state.keys[keyName] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); state.keys[keyName] = false; });
        btn.addEventListener('mousedown', () => { state.keys[keyName] = true; });
        btn.addEventListener('mouseup', () => { state.keys[keyName] = false; });
        btn.addEventListener('mouseleave', () => { state.keys[keyName] = false; });
    };

    bindTouchButton('btn-up', 'arrowup');
    bindTouchButton('btn-down', 'arrowdown');
    bindTouchButton('btn-left', 'arrowleft');
    bindTouchButton('btn-right', 'arrowright');

    document.getElementById('btn-interact').addEventListener('click', () => { triggerInteraction(); });

    canvas.addEventListener('click', (e) => {
        let rect = canvas.getBoundingClientRect();
        let clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
        let clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

        if (state.currentRoom === 'control_room') {
            if (clickX >= 100 && clickX <= 250 && clickY >= 70 && clickY <= 160) { triggerSpecificObject('wall_records'); }
            else if (clickX >= 280 && clickX <= 520 && clickY >= 340 && clickY <= 420) { triggerSpecificObject('mixing_console'); }
            else if (clickX >= 130 && clickX <= 250 && clickY >= 385 && clickY <= 435) { triggerSpecificObject('couch_phone'); }
            else if (clickX >= 35 && clickX <= 91 && clickY >= 335 && clickY <= 420) { triggerSpecificObject('door_to_booth'); }
            else if (clickX >= 705 && clickX <= 761 && clickY >= 335 && clickY <= 420) { triggerSpecificObject('door_to_street_from_control'); }
        } else if (state.currentRoom === 'street') {
            if (clickX >= 165 && clickX <= 210 && clickY >= 140 && clickY <= 200) { triggerSpecificObject('event_flyer'); }
            else if (clickX >= 350 && clickX <= 450 && clickY >= 280 && clickY <= 350) { triggerSpecificObject('mdm_graffiti_admin'); }
            else if (clickX >= 520 && clickX <= 690 && clickY >= 470 && clickY <= 530) { triggerSpecificObject('lowrider_trunk'); }
            else if (clickX >= 80 && clickX <= 130 && clickY >= 340 && clickY <= 420) { triggerSpecificObject('door_to_control_from_street'); }
        } else if (state.currentRoom === 'studio_booth') {
            if (clickX >= 235 && clickX <= 270 && clickY >= 300 && clickY <= 400) { triggerSpecificObject('vocal_mic'); }
            else if (clickX >= 120 && clickX <= 150 && clickY >= 340 && clickY <= 400) { triggerSpecificObject('studio_camera'); }
            else if (clickX >= 580 && clickX <= 660 && clickY >= 380 && clickY <= 420) { triggerSpecificObject('studio_notebook'); }
            else if (clickX >= 705 && clickX <= 761 && clickY >= 335 && clickY <= 420) { triggerSpecificObject('door_to_control_from_booth'); }
        }
    });

    function updatePlayer() {
        let moving = false;
        let p = state.player;

        if (state.keys['arrowup'] || state.keys['w']) { p.y -= p.speed; p.direction = 'up'; moving = true; }
        if (state.keys['arrowdown'] || state.keys['s']) { p.y += p.speed; p.direction = 'down'; moving = true; }
        if (state.keys['arrowleft'] || state.keys['a']) { p.x -= p.speed; p.direction = 'left'; moving = true; }
        if (state.keys['arrowright'] || state.keys['d']) { p.x += p.speed; p.direction = 'right'; moving = true; }

        p.isMoving = moving;

        if (state.currentRoom === 'control_room') {
            if (p.x < 40) p.x = 40; if (p.x > canvas.width - 40 - p.width) p.x = canvas.width - 40 - p.width;
            if (p.y < 350) p.y = 350; if (p.y > 540) p.y = 540;
        } else if (state.currentRoom === 'street') {
            if (p.x < 20) p.x = 20; if (p.x > canvas.width - 20 - p.width) p.x = canvas.width - 20 - p.width;
            if (p.y < 380) p.y = 380; if (p.y > 540) p.y = 540;
        } else if (state.currentRoom === 'studio_booth') {
            if (p.x < 40) p.x = 40; if (p.x > canvas.width - 40 - p.width) p.x = canvas.width - 40 - p.width;
            if (p.y < 350) p.y = 350; if (p.y > 540) p.y = 540;
        }
        checkProximity();
    }

    function checkProximity() {
        let p = state.player;
        let pCenterX = p.x + p.width / 2;
        let pCenterY = p.y + p.height / 2;
        let interactBtn = document.getElementById('btn-interact');
        state.nearObject = null;

        if (state.currentRoom === 'control_room') {
            if (Math.hypot(pCenterX - 63, pCenterY - 380) < 60) state.nearObject = 'door_to_booth';
            if (Math.hypot(pCenterX - 733, pCenterY - 380) < 60) state.nearObject = 'door_to_street_from_control';
            if (Math.hypot(pCenterX - 400, pCenterY - 400) < 70) state.nearObject = 'mixing_console';
            if (Math.hypot(pCenterX - 175, pCenterY - 115) < 85) state.nearObject = 'wall_records';
            if (Math.hypot(pCenterX - 190, pCenterY - 415) < 55) state.nearObject = 'couch_phone';
        } else if (state.currentRoom === 'street') {
            if (Math.hypot(pCenterX - 105, pCenterY - 380) < 60) state.nearObject = 'door_to_control_from_street';
            if (Math.hypot(pCenterX - 187, pCenterY - 170) < 55) state.nearObject = 'event_flyer';
            if (Math.hypot(pCenterX - 400, pCenterY - 315) < 75) state.nearObject = 'mdm_graffiti_admin';
            if (Math.hypot(pCenterX - 550, pCenterY - 490) < 65) state.nearObject = 'lowrider_trunk';
        } else if (state.currentRoom === 'studio_booth') {
            if (Math.hypot(pCenterX - 733, pCenterY - 380) < 60) state.nearObject = 'door_to_control_from_booth';
            if (Math.hypot(pCenterX - 253, pCenterY - 350) < 55) state.nearObject = 'vocal_mic';
            if (Math.hypot(pCenterX - 135, pCenterY - 370) < 55) state.nearObject = 'studio_camera';
            if (Math.hypot(pCenterX - 620, pCenterY - 400) < 50) state.nearObject = 'studio_notebook';
        }

        if (state.nearObject) {
            interactBtn.style.opacity = '1';
            interactBtn.style.boxShadow = '0 0 15px rgba(0, 240, 255, 0.6)';
        } else {
            interactBtn.style.opacity = '0.7';
            interactBtn.style.boxShadow = '0 0 10px rgba(0, 240, 255, 0.3)';
        }
    }

    function drawPlayer() {
        let p = state.player;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(p.x + p.width / 2, p.y + p.height, p.width / 2, 6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111318'; ctx.fillRect(p.x + 4, p.y + 16, 28, 26);
        ctx.fillStyle = '#181b22'; ctx.fillRect(p.x + 6, p.y + 40, 10, 12); ctx.fillRect(p.x + 20, p.y + 40, 10, 12);
        ctx.fillStyle = '#f2d3bc'; ctx.fillRect(p.x + 10, p.y + 4, 16, 14);
        ctx.fillStyle = '#22160b'; ctx.fillRect(p.x + 8, p.y, 20, 6); ctx.fillRect(p.x + 7, p.y + 3, 4, 6); ctx.fillRect(p.x + 25, p.y + 3, 4, 6);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(p.x + 5, p.y + 50, 10, 3); ctx.fillRect(p.x + 21, p.y + 50, 10, 3);
    }
</script>
<script>
    function triggerInteraction() {
        if (!state.nearObject) return;
        triggerSpecificObject(state.nearObject);
    }

    function triggerSpecificObject(objName) {
        let data = getStudioData();

        if (objName === 'door_to_booth') {
            state.currentRoom = 'studio_booth'; state.player.x = 680; state.player.y = 430;
            document.getElementById('hud-zone').textContent = 'Zone: Live Studio Booth';
        } else if (objName === 'door_to_street_from_control') {
            state.currentRoom = 'street'; state.player.x = 120; state.player.y = 430;
            document.getElementById('hud-zone').textContent = 'Zone: Street Entrance';
        } else if (objName === 'door_to_control_from_street') {
            state.currentRoom = 'control_room'; state.player.x = 100; state.player.y = 430;
            document.getElementById('hud-zone').textContent = 'Zone: Control Room';
        } else if (objName === 'door_to_control_from_booth') {
            state.currentRoom = 'control_room'; state.player.x = 80; state.player.y = 430;
            document.getElementById('hud-zone').textContent = 'Zone: Control Room';
        } else if (objName === 'event_flyer') {
            let ev = data.event || {};
            showCustomModal("LIVE PERFORMANCE FLYER", `
                <div style="font-size: 13px; color: #00f0ff; margin-bottom: 8px; font-weight: bold;">${ev.title || 'Live Showcase'}</div>
                <div style="font-size: 11px; color: #fff; margin-bottom: 4px;">📅 Date: ${ev.date || 'TBD'}</div>
                <div style="font-size: 11px; color: #fff; margin-bottom: 4px;">⏰ Time: ${ev.time || '8:00 PM'}</div>
                <div style="font-size: 11px; color: #fff; margin-bottom: 12px;">📍 Venue: ${ev.venue || 'PA'}</div>
                <a href="${ev.link || '#'}" target="_blank" style="display: block; padding: 10px; background: #00f0ff; color: #0d0e12; text-align: center; text-decoration: none; font-weight: bold; border-radius: 6px;">GET TICKETS</a>
            `);
        } else if (objName === 'lowrider_trunk') {
            showAudioSnippetModal("🚗 LOWRIDER TRUNK SNIPPET", data.trunkSnippet, data.trunkOffset || 0);
        } else if (objName === 'mdm_graffiti_admin') {
            openAdminLoginModal();
        } else if (objName === 'mixing_console') {
            showVideoModal("🎛️ STUDIO MONITORS // VISUALIZER", data.visualizerUrl);
        } else if (objName === 'wall_records') {
            let info = data.records.map(r => `<div style="margin-bottom: 8px; border-bottom: 1px solid #232733; padding-bottom: 4px;"><strong style="color: #00f0ff;">${r.title}</strong><br><span style="font-size: 10px; color: #8a8f9e;">Release: ${r.date}</span></div>`).join('');
            showCustomModal("📀 OFFICIAL DISCOGRAPHY", info);
        } else if (objName === 'couch_phone') {
            let s = data.socials;
            showCustomModal("📱 STUDIO PHONE // SOCIALS", `
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <a href="${s.tiktok}" target="_blank" style="padding: 8px; background: #232733; color: #00f0ff; text-align: center; text-decoration: none; border-radius: 4px;">TikTok</a>
                    <a href="${s.instagram}" target="_blank" style="padding: 8px; background: #232733; color: #00f0ff; text-align: center; text-decoration: none; border-radius: 4px;">Instagram</a>
                    <a href="${s.soundcloud}" target="_blank" style="padding: 8px; background: #232733; color: #00f0ff; text-align: center; text-decoration: none; border-radius: 4px;">SoundCloud</a>
                </div>
            `);
        } else if (objName === 'vocal_mic') {
            showAudioSnippetModal("🎙️ MIC STAND // LATEST DROP", data.latestDropSnippet, data.latestOffset || 0);
        } else if (objName === 'studio_camera') {
            showVideoModal("📹 STUDIO CAMERA // INTERVIEW", data.interviewUrl);
        } else if (objName === 'studio_notebook') {
            showCustomModal("📓 STUDIO NOTEBOOK", `<pre style="white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 11px; color: #00f0ff;">${data.lyrics}</pre>`);
        }
    }

    function showCustomModal(title, htmlContent) {
        let existing = document.getElementById('game-custom-modal');
        if (existing) existing.remove();

        let modal = document.createElement('div');
        modal.id = 'game-custom-modal';
        modal.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 14, 18, 0.92); display: flex; align-items: center; justify-content: center; z-index: 1000; font-family: 'Courier New', monospace; padding: 20px;`;
        modal.innerHTML = `
            <div style="background: #14161d; border: 2px solid #00f0ff; padding: 20px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 0 20px rgba(0,240,255,0.3); color: #fff;">
                <h3 style="color: #00f0ff; font-size: 14px; margin-bottom: 12px; letter-spacing: 1px;">${title}</h3>
                <div style="margin-bottom: 16px; font-size: 11px; line-height: 1.4;">${htmlContent}</div>
                <button id="modal-close-btn" style="width: 100%; padding: 10px; background: #00f0ff; color: #0d0e12; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">CLOSE</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('modal-close-btn').addEventListener('click', () => modal.remove());
    }

    function showAudioSnippetModal(title, audioUrl, startOffset) {
        let existing = document.getElementById('game-custom-modal');
        if (existing) existing.remove();

        let modal = document.createElement('div');
        modal.id = 'game-custom-modal';
        modal.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 14, 18, 0.92); display: flex; align-items: center; justify-content: center; z-index: 1000; font-family: 'Courier New', monospace; padding: 20px;`;
        modal.innerHTML = `
            <div style="background: #14161d; border: 2px solid #00f0ff; padding: 20px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 0 20px rgba(0,240,255,0.3); color: #fff;">
                <h3 style="color: #00f0ff; font-size: 14px; margin-bottom: 12px; letter-spacing: 1px;">${title}</h3>
                <p style="font-size: 11px; color: #8a8f9e; margin-bottom: 10px;">Audio Snippet (Starts at ${startOffset}s offset)</p>
                <audio id="snippet-audio" controls style="width: 100%; margin-bottom: 16px;" src="${audioUrl}"></audio>
                <button id="modal-close-btn" style="width: 100%; padding: 10px; background: #00f0ff; color: #0d0e12; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">CLOSE</button>
            </div>
        `;
        document.body.appendChild(modal);

        let audio = document.getElementById('snippet-audio');
        audio.addEventListener('loadedmetadata', () => {
            if (startOffset > 0 && startOffset < audio.duration) {
                audio.currentTime = Number(startOffset);
            }
        });

        document.getElementById('modal-close-btn').addEventListener('click', () => {
            audio.pause();
            modal.remove();
        });
    }

    function showVideoModal(title, videoUrl) {
        let existing = document.getElementById('game-custom-modal');
        if (existing) existing.remove();

        let embedUrl = videoUrl;
        if (videoUrl.includes('watch?v=')) embedUrl = videoUrl.replace('watch?v=', 'embed/');

        let modal = document.createElement('div');
        modal.id = 'game-custom-modal';
        modal.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 14, 18, 0.92); display: flex; align-items: center; justify-content: center; z-index: 1000; font-family: 'Courier New', monospace; padding: 20px;`;
        modal.innerHTML = `
            <div style="background: #14161d; border: 2px solid #00f0ff; padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 0 20px rgba(0,240,255,0.3); color: #fff;">
                <h3 style="color: #00f0ff; font-size: 14px; margin-bottom: 12px; letter-spacing: 1px;">${title}</h3>
                <div style="position: relative; width: 100%; aspect-ratio: 16/9; margin-bottom: 16px; background: #000;">
                    <iframe src="${embedUrl}" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>
                </div>
                <button id="modal-close-btn" style="width: 100%; padding: 10px; background: #00f0ff; color: #0d0e12; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">CLOSE</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('modal-close-btn').addEventListener('click', () => modal.remove());
    }

    function openAdminLoginModal() {
        let pin = prompt("Enter Secret Admin Passcode :");
        if (pin === null) return;
        let settings = JSON.parse(localStorage.getItem('sosa_admin_settings') || '{"code":"2323"}');
        if (pin === settings.code) { state.adminUnlocked = true; openAdminDashboard(); }
        else { alert("Incorrect Passcode."); }
    }

    function openAdminDashboard() {
        let existingModal = document.getElementById('admin-dashboard-modal');
        if (existingModal) existingModal.remove();
        let data = getStudioData();

        let modal = document.createElement('div');
        modal.id = 'admin-dashboard-modal';
        modal.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 14, 18, 0.94); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; font-family: 'Courier New', monospace; color: #fff; padding: 20px;`;

        modal.innerHTML = `
            <div style="background: #14161d; border: 2px solid #00f0ff; padding: 20px; border-radius: 12px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 20px rgba(0,240,255,0.3);">
                <h2 style="color: #00f0ff; margin-bottom: 8px; font-size: 18px; letter-spacing: 1px;">AO SOSA STUDIO // ADMIN DASHBOARD</h2>
                <p style="font-size: 11px; color: #8a8f9e; margin-bottom: 16px;">Update audio URLs, start time offsets, show flyer, lyrics, and socials in real-time.</p>
                
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 11px; color: #00f0ff; display: block;">Lowrider Trunk Snippet URL:</label>
                    <input type="text" id="adm-trunk" value="${data.trunkSnippet || ''}" style="width: 100%; padding: 6px; background: #0d0e12; border: 1px solid #3a3f52; color: #fff; border-radius: 4px; font-size: 11px; margin-bottom: 4px;">
                    <label style="font-size: 10px; color: #8a8f9e;">Start Offset (seconds):</label>
                    <input type="number" id="adm-trunk-off" value="${data.trunkOffset || 0}" style="width: 100%; padding: 4px; background: #0d0e12; border: 1px solid #3a3f52; color: #fff; border-radius: 4px; font-size: 11px;">
                </div>

                <div style="margin-bottom: 10px;">
                    <label style="font-size: 11px; color: #00f0ff; display: block;">Latest Drop Mic Snippet URL:</label>
                    <input type="text" id="adm-mic" value="${data.latestDropSnippet || ''}" style="width: 100%; padding: 6px; background: #0d0e12; border: 1px solid #3a3f52; color: #fff; border-radius: 4px; font-size: 11px; margin-bottom: 4px;">
                    <label style="font-size: 10px; color: #8a8f9e;">Start Offset (seconds):</label>
                    <input type="number" id="adm-mic-off" value="${data.latestOffset || 0}" style="width: 100%; padding: 4px; background: #0d0e12; border: 1px solid #3a3f52; color: #fff; border-radius: 4px; font-size: 11px;">
                </div>

                <div style="margin-bottom: 10px;">
                    <label style="font-size: 11px; color: #00f0ff; display: block;">Console Visualizer YouTube URL:</label>
                    <input type="text" id="adm-visualizer" value="${data.visualizerUrl || ''}" style="width: 100%; padding: 6px; background: #0d0e12; border: 1px solid #3a3f52; color: #fff; border-radius: 4px; font-size: 11px;">
                </div>

                <div style="margin-bottom: 10px;">
                    <label style="font-size: 11px; color: #00f0ff; display: block;">Live Show Flyer (Title | Date | Venue | Link):</label>
                    <input type="text" id="adm-ev-title" value="${data.event?.title || ''}" placeholder="Show Title" style="width: 48%; padding: 6px; background: #0d0e12; border: 1px solid #3a3f52; color: #fff; border-radius: 4px; font-size: 10px; margin-bottom: 4px;">
                    <input type="text" id="adm-ev-date" value="${data.event?.date || ''}" placeholder="Date" style="width: 48%; padding: 6px; background: #0d0e12; border: 1px solid #3a3f52; color: #fff; border-radius: 4px; font-size: 10px; margin-bottom: 4px;">
                    <input type="text" id="adm-ev-venue" value="${data.event?.venue || ''}" placeholder="Venue" style="width: 48%; padding: 6px; background: #0d0e12; border: 1px solid #3a3f52; color: #fff; border-radius: 4px; font-size: 10px;">
                    <input type="text" id="adm-ev-link" value="${data.event?.link || ''}" placeholder="Ticket Link" style="width: 48%; padding: 6px; background: #0d0e12; border: 1px solid #3a3f52; color: #fff; border-radius: 4px; font-size: 10px;">
                </div>

                <div style="margin-bottom: 12px;">
                    <label style="font-size: 11px; color: #00f0ff; display: block;">Studio Notebook (Lyrics / Thoughts):</label>
                    <textarea id="adm-lyrics" rows="3" style="width: 100%; padding: 6px; background: #0d0e12; border: 1px solid #3a3f52; color: #fff; border-radius: 4px; font-size: 11px;">${data.lyrics || ''}</textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button id="adm-save-btn" style="flex: 1; padding: 10px; background: #00f0ff; color: #0d0e12; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">SAVE ALL CHANGES</button>
                    <button id="adm-close-btn" style="flex: 1; padding: 10px; background: #ff0055; color: #fff; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">CLOSE</button>
                </div>
            </div>
            <div style="margin-bottom: 10px;">
        <label style="font-size: 11px; color: #aaa; display: block; margin-bottom: 3px;">Studio TV Interview YouTube URL:</label>
        <input type="text" id="adm-tv-url" style="width: 100%; padding: 6px; background: #0a0a0f; border: 1px solid #333; color: #fff; border-radius: 4px;" placeholder="https://www.youtube.com/watch?v=...">
    </div>

    <div style="margin-bottom: 10px; border-top: 1px solid #333; padding-top: 8px;">
        <label style="font-size: 11px; color: #00f0ff; display: block; margin-bottom: 5px;">WALL RECORDS CONFIGURATION</label>
        <input type="text" id="adm-rec-0-title" placeholder="Record 1 Title" style="width: 100%; padding: 5px; margin-bottom: 4px; background: #0a0a0f; border: 1px solid #333; color: #fff; border-radius: 4px;">
        <input type="text" id="adm-rec-0-img" placeholder="Record 1 Cover Art URL" style="width: 100%; padding: 5px; margin-bottom: 8px; background: #0a0a0f; border: 1px solid #333; color: #fff; border-radius: 4px;">
        
        <input type="text" id="adm-rec-1-title" placeholder="Record 2 Title" style="width: 100%; padding: 5px; margin-bottom: 4px; background: #0a0a0f; border: 1px solid #333; color: #fff; border-radius: 4px;">
        <input type="text" id="adm-rec-1-img" placeholder="Record 2 Cover Art URL" style="width: 100%; padding: 5px; margin-bottom: 8px; background: #0a0a0f; border: 1px solid #333; color: #fff; border-radius: 4px;">

        <input type="text" id="adm-rec-2-title" placeholder="Record 3 Title" style="width: 100%; padding: 5px; margin-bottom: 4px; background: #0a0a0f; border: 1px solid #333; color: #fff; border-radius: 4px;">
        <input type="text" id="adm-rec-2-img" placeholder="Record 2 Cover Art URL" style="width: 100%; padding: 5px; background: #0a0a0f; border: 1px solid #333; color: #fff; border-radius: 4px;">
    </div>
`;
        document.body.appendChild(modal);

        document.getElementById('adm-save-btn').addEventListener('click', () => {
            let updatedData = {
                trunkSnippet: document.getElementById('adm-trunk').value,
                trunkOffset: Number(document.getElementById('adm-trunk-off').value) || 0,
                latestDropSnippet: document.getElementById('adm-mic').value,
                latestOffset: Number(document.getElementById('adm-mic-off').value) || 0,
                visualizerUrl: document.getElementById('adm-visualizer').value,
                interviewUrl: data.interviewUrl,
                socials: data.socials,
                records: data.records,
                lyrics: document.getElementById('adm-lyrics').value,
                event: {
                    title: document.getElementById('adm-ev-title').value,
                    date: document.getElementById('adm-ev-date').value,
                    venue: document.getElementById('adm-ev-venue').value,
                    link: document.getElementById('adm-ev-link').value
                }
            };
            localStorage.setItem('sosa_studio_data', JSON.stringify(updatedData));
            alert("All studio media & events updated live!");
            modal.remove();
        });

        document.getElementById('adm-close-btn').addEventListener('click', () => modal.remove());
    }

    function gameLoop() {
        updatePlayer();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawRoom();
        drawPlayer();
        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
